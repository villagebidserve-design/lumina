<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#0F3460" />
      <stop offset="100%" stopColor="#1A1A2E" />
    </linearGradient>
    <linearGradient id="thunderGrad" x1="60" y1="20" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF275" />
      <stop offset="40%" stopColor="#FFB800" />
      <stop offset="100%" stopColor="#FF5722" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="38" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.4" />

  <!-- Electric Glow Aura -->
  <circle cx="96" cy="96" r="60" fill="#FFB800" opacity="0.15" filter="url(#glow)" />

  <!-- Lightning Bolt Stem -->
  <path
    d="M106 24L52 98H98L78 168L148 84H98L106 24Z"
    fill="url(#thunderGrad)"
    stroke="#FFE082"
    stroke-width="2"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Spark Dot -->
  <circle cx="106" cy="24" r="5" fill="#FFF275" />
</svg>