<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#0F3460" />
      <stop offset="100%" stopColor="#1A1A2E" />
    </linearGradient>
    <linearGradient id="thunderGrad512" x1="160" y1="50" x2="360" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF275" />
      <stop offset="40%" stopColor="#FFB800" />
      <stop offset="100%" stopColor="#FF5722" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad512)" />
  <rect x="6" y="6" width="500" height="500" rx="96" fill="none" stroke="#FFB800" stroke-width="4" opacity="0.4" />

  <!-- Electric Glow Aura -->
  <circle cx="256" cy="256" r="160" fill="#FFB800" opacity="0.18" filter="url(#glow512)" />

  <!-- Lightning Bolt Stem -->
  <path
    d="M280 64L140 260H260L210 448L392 220H260L280 64Z"
    fill="url(#thunderGrad512)"
    stroke="#FFE082"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#glow512)"
  />

  <!-- Spark Dot -->
  <circle cx="280" cy="64" r="14" fill="#FFF275" />
</svg>